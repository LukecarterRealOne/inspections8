name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate project
        id: locate
        run: |
          set -e
          f=$(find . -maxdepth 3 -name gradlew -not -path './.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "::error::gradlew not found. Files in repo:"; find . -maxdepth 3 -not -path './.git/*' | head -50
            exit 1
          fi
          d=$(dirname "$f")
          echo "Project dir: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: inspectitems-1.21.11
          path: |
            ${{ steps.locate.outputs.dir }}/build/libs/*.jar
            !${{ steps.locate.outputs.dir }}/build/libs/*-sources.jar
          if-no-files-found: error
